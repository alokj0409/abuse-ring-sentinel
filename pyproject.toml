[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abuse-ring-sentinel"
version = "0.1.0"
description = "Reproducible abuse-ring discovery and evaluation on IEEE-CIS transactions"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
gnn = ["torch>=2.4,<3", "torch-geometric>=2.6,<3"]

[project.scripts]
abuse-ring-sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
